[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nl-sat-pl"
version = "0.1.0"
description = "Polish language adaptation of the original natural language satisfiability framework"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [
    {name = "nestivi"},
    {name = "iTharindu"}
]
dependencies = [
    "z3-solver>=4.12.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "nltk>=3.6.0",
    "tqdm>=4.62.0"
]

[project.scripts]
nl-sat-gen = "data_construction:main"

[tool.setuptools]
py-modules = ["data_construction", "fragments"]